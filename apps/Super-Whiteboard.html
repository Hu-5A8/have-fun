<style>
*{box-sizing:border-box}
:root{
  --ui-bg:#ffffff; --ui-bg-2:#f3f3f6; --ui-border:#e2e2e8; --ui-text:#1f2024; --ui-muted:#6b6d78;
  --accent:#2f7bff; --accent-soft:#e7f0ff; --accent-text:#1b62e0;
  --danger:#d6336c; --danger-soft:#fde8ef;
  --warn-bg:#fff8e6; --warn-text:#7a5200; --warn-border:#f1d48c;
  --canvas:#ffffff;
  --shadow:0 1px 2px rgba(16,18,27,.06),0 4px 14px rgba(16,18,27,.07);
  color-scheme:light;
}
[data-theme=dark]{
  --ui-bg:#232329; --ui-bg-2:#2d2d35; --ui-border:#3a3a44; --ui-text:#ececf1; --ui-muted:#9c9eaa;
  --accent:#5ea2ff; --accent-soft:#1d3456; --accent-text:#a8cbff;
  --danger:#ff6b8b; --danger-soft:#4a2530;
  --warn-bg:#3a3020; --warn-text:#f5d58a; --warn-border:#6b5520;
  --canvas:#1b1b1f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.35);
  color-scheme:dark;
}
html,body{margin:0;height:100%;overflow:hidden;background:var(--canvas);color:var(--ui-text);
  font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit}
#board{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}

.panel{position:fixed;z-index:10;background:var(--ui-bg);border:1px solid var(--ui-border);border-radius:12px;box-shadow:var(--shadow)}
#toolbar{top:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:4px}
#actions{top:12px;right:12px;display:flex;align-items:center;gap:2px;padding:3px}
#props{left:12px;top:50%;transform:translateY(-50%);width:88px;padding:8px;display:flex;flex-direction:column;gap:10px}
#tabs{left:12px;bottom:12px;display:flex;gap:2px;padding:4px;max-width:calc(100vw - 400px);overflow-x:auto;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:none}
.tab-add{padding:0 10px;display:grid;place-items:center}
.tab-add svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.name-input{width:100%;height:42px;padding:0 12px;border:1.5px solid var(--ui-border);border-radius:9px;background:var(--ui-bg);color:var(--ui-text);font:inherit;font-size:16px;outline:none}
.name-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
#zoombar{right:12px;bottom:12px;display:flex;align-items:center;gap:2px;padding:4px}

.btn{width:38px;height:38px;border:0;background:transparent;border-radius:8px;display:grid;place-items:center;cursor:pointer;position:relative;flex:none;color:var(--ui-text)}
.btn:hover{background:var(--ui-bg-2)}
.btn[aria-pressed=true]{background:var(--accent-soft);color:var(--accent-text)}
.btn:disabled{opacity:.32;cursor:default;background:transparent}
.btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn .key{position:absolute;right:3px;bottom:1px;font-size:9px;line-height:1;color:var(--ui-muted);font-weight:500}
.btn[aria-pressed=true] .key{color:var(--accent-text)}
.btn.sm{width:32px;height:32px}
.btn.sm svg{width:18px;height:18px}
.sep{width:1px;height:22px;background:var(--ui-border);margin:0 4px;flex:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* tooltips */
@media (hover:hover){
  [data-tip]:hover::after{content:attr(data-tip);position:absolute;white-space:nowrap;background:#1f2024;color:#fff;font-size:12px;font-weight:400;line-height:1.4;
    padding:5px 9px;border-radius:6px;pointer-events:none;z-index:80;top:calc(100% + 8px);left:50%;transform:translateX(-50%);opacity:0;animation:tip .12s .45s forwards}
  [data-theme=dark] [data-tip]:hover::after{background:#f1f1f4;color:#1f2024}
  .tip-r[data-tip]:hover::after{top:50%;left:calc(100% + 12px);transform:translateY(-50%)}
  .tip-t[data-tip]:hover::after{top:auto;bottom:calc(100% + 8px)}
  .tip-tl[data-tip]:hover::after{top:auto;bottom:calc(100% + 8px);left:0;transform:none}
  .tip-tr[data-tip]:hover::after{top:auto;bottom:calc(100% + 8px);left:auto;right:0;transform:none}
  .tip-br[data-tip]:hover::after{left:auto;right:0;transform:none}
  [aria-expanded=true][data-tip]:hover::after{display:none}
}
@keyframes tip{to{opacity:1}}

/* props panel */
.sec{display:flex;flex-direction:column;gap:6px}
.sec-label{font-size:11px;color:var(--ui-muted);padding-left:2px;letter-spacing:.02em}
.swatches{display:grid;grid-template-columns:repeat(2,32px);gap:6px;justify-content:center}
.sw{width:32px;height:32px;border-radius:8px;border:0;cursor:pointer;position:relative;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
[data-theme=dark] .sw{box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.sw.active::before{content:"";position:absolute;inset:-4px;border-radius:11px;border:2px solid var(--accent)}
.sw-ink{background:linear-gradient(135deg,#1e1e1e 0 50%,#f4f4f4 50% 100%)}
.seg{display:grid;gap:4px}
.seg3{grid-template-columns:repeat(3,1fr)}
.seg2{grid-template-columns:repeat(2,1fr)}
.seg button{height:30px;border:0;border-radius:7px;background:var(--ui-bg-2);cursor:pointer;font-size:12px;display:grid;place-items:center;position:relative;color:var(--ui-text);padding:0}
.seg button:hover{filter:brightness(.97)}
[data-theme=dark] .seg button:hover{filter:brightness(1.15)}
.seg button.active{background:var(--accent-soft);color:var(--accent-text);font-weight:600;box-shadow:inset 0 0 0 1.5px var(--accent)}
.seg .line{display:block;width:16px;border-radius:9px;background:currentColor}

/* tabs */
.tab{height:34px;padding:0 15px;border:0;border-radius:8px;background:transparent;color:var(--ui-muted);cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap;position:relative}
.tab:hover{background:var(--ui-bg-2);color:var(--ui-text)}
.tab.active{background:var(--accent-soft);color:var(--accent-text);font-weight:650}
.tab-input{height:34px;padding:0 10px;border:1.5px solid var(--accent);border-radius:8px;background:var(--ui-bg);color:var(--ui-text);font:inherit;font-size:14px;outline:none;user-select:text;-webkit-user-select:text}

/* zoom / status */
.zlabel{min-width:54px;height:32px;border:0;background:transparent;border-radius:8px;cursor:pointer;font-size:13px;font-variant-numeric:tabular-nums;position:relative;color:var(--ui-text)}
.zlabel:hover{background:var(--ui-bg-2)}
.status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ui-muted);padding:0 8px 0 6px;height:32px;position:relative;cursor:default;white-space:nowrap}
.status .dot{width:8px;height:8px;border-radius:50%;background:#f03e3e;box-shadow:0 0 0 3px rgba(240,62,62,.18);flex:none;transition:background .2s}
.status[data-state=saving] .dot{background:#f59f00;box-shadow:0 0 0 3px rgba(245,159,0,.2)}
.status[data-state=error]{color:var(--danger);cursor:pointer;font-weight:600}
.status[data-state=error] .dot{background:var(--danger);animation:blink 1s steps(2) infinite}

/* menu */
.menu{position:fixed;z-index:60;padding:6px;min-width:250px;border-radius:12px}
.mi{display:flex;align-items:center;gap:11px;width:100%;padding:8px 10px;border:0;background:transparent;border-radius:8px;font-size:14px;text-align:left;cursor:pointer;color:var(--ui-text)}
.mi:hover:not(:disabled){background:var(--ui-bg-2)}
.mi:disabled{opacity:.4;cursor:default}
.mi svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;color:var(--ui-muted)}
.mi-text{flex:1;display:flex;flex-direction:column;gap:1px}
.mi small{font-size:12px;color:var(--ui-muted)}

.menu-foot{font-size:12px;color:var(--ui-muted);padding:7px 10px 4px}
kbd{font-family:ui-monospace,Consolas,"SF Mono",monospace;font-size:11.5px;padding:1px 6px;border:1px solid var(--ui-border);border-bottom-width:2px;border-radius:5px;background:var(--ui-bg-2);color:var(--ui-text);white-space:nowrap}

/* dialog */
.overlay{position:fixed;inset:0;z-index:100;background:rgba(10,10,16,.38);display:grid;place-items:center;padding:16px}
.dialog{width:min(460px,100%);background:var(--ui-bg);border:1px solid var(--ui-border);border-radius:14px;padding:22px 22px 18px;box-shadow:0 20px 60px rgba(0,0,0,.25);max-height:calc(100vh - 32px);overflow:auto;user-select:text;-webkit-user-select:text}
.dialog.wide{width:min(720px,100%)}
.dialog h2{margin:0 0 10px;font-size:18px;font-weight:650}
.dialog p{margin:0 0 12px;font-size:14px;line-height:1.7;color:var(--ui-text)}
.dialog .muted-s{font-size:13px;color:var(--ui-muted)}
.actions-row{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:18px}
.dbtn{height:38px;padding:0 16px;border-radius:9px;font-size:14px;border:1px solid var(--ui-border);background:var(--ui-bg);color:var(--ui-text);cursor:pointer;font-weight:500}
.dbtn:hover{background:var(--ui-bg-2)}
.dbtn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.dbtn.danger:hover{filter:brightness(.94)}
.dbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
[data-theme=dark] .dbtn.primary,[data-theme=dark] .dbtn.danger{color:#15151a}
.help-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 28px}
.help-grid h3{font-size:13px;color:var(--ui-muted);margin:12px 0 4px;font-weight:600}
.kr{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13.5px;padding:4px 0;border-bottom:1px dashed var(--ui-border)}
.kr span:last-child{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.help-note{margin-top:16px;padding:12px 14px;border-radius:10px;background:var(--ui-bg-2);font-size:13px;line-height:1.75}
@media (max-width:640px){.help-grid{grid-template-columns:1fr}}

/* misc */
#editor{position:fixed;display:none;z-index:5;margin:0;padding:0;border:0;background:transparent;resize:none;overflow:hidden;white-space:pre;
  outline:none;tab-size:4;min-width:6px;user-select:text;-webkit-user-select:text;letter-spacing:0}
.hint{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:var(--ui-muted);font-size:15px;line-height:1.9;pointer-events:none;opacity:0;transition:opacity .2s;z-index:1}
.hint.show{opacity:1}
.hint-title{font-size:22px;font-weight:600;color:var(--ui-text);opacity:.5;margin-bottom:4px}
#toast{position:fixed;left:50%;bottom:66px;transform:translate(-50%,8px);background:#1f2024;color:#fff;padding:9px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:200;max-width:calc(100vw - 32px);text-align:center;line-height:1.5}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.err{background:var(--danger);color:#fff}
[data-theme=dark] #toast{background:#f1f1f4;color:#1f2024}
#toast.has-act{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:6px 6px 6px 16px}
#toast button{border:0;background:rgba(255,255,255,.16);color:inherit;font:inherit;font-weight:600;border-radius:7px;padding:5px 12px;cursor:pointer}
#toast button:hover{background:rgba(255,255,255,.26)}
[data-theme=dark] #toast button{background:rgba(0,0,0,.08)}
[data-theme=dark] #toast button:hover{background:rgba(0,0,0,.15)}
[data-theme=dark] #toast.err{background:var(--danger);color:#15151a}
.banner{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:30;background:var(--warn-bg);color:var(--warn-text);border:1px solid var(--warn-border);padding:7px 8px 7px 14px;border-radius:10px;font-size:13px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow);max-width:calc(100vw - 24px)}
.banner button{border:0;background:transparent;color:inherit;font-weight:600;cursor:pointer;padding:4px 8px;border-radius:6px}
.banner button:hover{background:rgba(0,0,0,.06)}

/* 收合式工具列 */
#launcher{bottom:12px;left:12px;display:flex;align-items:center;gap:0;padding:4px}
#launcher .lx{max-width:240px;opacity:1;transition:max-width .22s ease,opacity .16s ease,padding .22s ease,margin .22s ease;overflow:hidden}
#launcher.mini .lx{max-width:0;opacity:0;padding-left:0;padding-right:0;margin:0;pointer-events:none}
#launcher.mini .ldot[data-state=error]{max-width:30px;opacity:1}
#launcher .chip + .chip{margin-left:2px}
#launcher.mini .chip{margin-left:0}
.chip{height:38px;display:flex;align-items:center;gap:6px;padding:0 8px 0 9px;border:0;background:transparent;border-radius:8px;cursor:pointer;font-size:14px;color:var(--ui-text);position:relative;white-space:nowrap}
.chip:hover{background:var(--ui-bg-2)}
.chip[aria-expanded=true]{background:var(--ui-bg-2)}
.chip svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.chip svg:last-child{width:13px;height:13px;opacity:.55}
.cdot{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(127,127,127,.5);flex:none}
.ldot{width:20px;height:38px;display:grid;place-items:center;position:relative}
.ldot::before{content:"";width:8px;height:8px;border-radius:50%;background:#f03e3e;box-shadow:0 0 0 3px rgba(240,62,62,.18);transition:background .2s,box-shadow .2s}
.ldot[data-state=saving]::before{background:#f59f00;box-shadow:0 0 0 3px rgba(245,159,0,.2)}

body.ui-collapsed #toolbar,body.ui-collapsed #props,body.ui-collapsed #tabs,body.ui-collapsed #zoombar{display:none}
body:not(.ui-collapsed) #launcher .chip,body:not(.ui-collapsed) #launcher .ldot{display:none}

body.ui-collapsed #actions .expand-only{display:none}
/* 右下角常駐垃圾桶 */

#dock .btn{color:var(--ui-muted)}
#dock .btn.armed{background:var(--danger-soft);color:var(--danger)}
#dock .badge{position:absolute;top:1px;right:1px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--danger);color:#fff;font-size:10.5px;font-weight:700;line-height:17px;text-align:center;box-shadow:0 0 0 2px var(--ui-bg)}

body:not(.ui-collapsed) #tabs{left:102px}
/* 右鍵快速選單 */
.ctx{width:286px;padding:8px}
.ctx-label{font-size:11px;color:var(--ui-muted);margin:2px 4px 6px}
.ctx-row{display:flex;gap:6px;padding:0 3px 8px;flex-wrap:wrap}
.ctx-row .sw{width:26px;height:26px;border-radius:7px}
.ctx-row .sw.active::before{inset:-3px;border-radius:9px}
.ctx-tools{display:flex;gap:1px;padding:0 0 6px}

@media (max-width:1040px){
  #toolbar{left:12px;transform:none;max-width:calc(100vw - 200px);overflow-x:auto;scrollbar-width:none}

}
@media (max-height:600px){ #props{top:64px;transform:none} }
@media print{ .panel,#toast,.hint{display:none!important} }

<body class="ui-collapsed">

<div id="hint" class="hint">

</div>

<input type="file" id="fileInput" accept=".json,application/json" hidden>

<script>
(() => {
'use strict';

/* ================= 常數與設定 ================= */
const $ = (s, r = document) => r.querySelector(s);
const canvas = $('#board'), ctx = canvas.getContext('2d');
const mctx = document.createElement('canvas').getContext('2d');
const editor = $('#editor');
const LH = 1.3;                 // 文字行高
const MAX_HIST = 120;           // 每個分頁的復原步數
const APP_ID = 'classroom-whiteboard';
const FONTS = {
  sans: '"Noto Sans TC","Microsoft JhengHei","PingFang TC","Heiti TC",system-ui,sans-serif',
  mono: 'Consolas,"Cascadia Mono","SF Mono",Menlo,"Noto Sans Mono CJK TC","Microsoft JhengHei",monospace'
};
const CANVAS_BG = { light: '#ffffff', dark: '#1b1b1f' };
const ACCENT = { light: '#2f7bff', dark: '#5ea2ff' };
const COLORS = [
  { id: 'ink', name: '自動墨色（淺色模式為黑、深色模式為白）' },
  { id: '#1e1e1e', name: '黑色' },
  { id: '#ffffff', name: '白色' },
  { id: '#e03131', name: '紅色' },
  { id: '#1c7ed6', name: '藍色' },
  { id: '#f08c00', name: '橘色' },
  { id: '#ae3ec9', name: '紫色' },
  { id: '#868e96', name: '灰色' },
];
const STROKES = [{ v: 2, label: '細' }, { v: 4, label: '中' }, { v: 8, label: '粗' }];
const SIZES = [{ v: 28, label: '小' }, { v: 40, label: '中' }, { v: 64, label: '大' }, { v: 96, label: '特大' }];
const DEFAULT_NAMES = ['四年級', '五年級', '六年級'];
const STROKE_TYPES = ['pen', 'rect', 'ellipse', 'arrow'];

const r1 = v => Math.round(v * 10) / 10;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-5);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const loadJSON = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
const isNum = v => typeof v === 'number' && isFinite(v);

let settings = Object.assign({ theme: 'light', color: 'ink', sw: 4, fontSize: 40, font: 'sans', lastBackup: 0, pinUI: false, showGrid: false }, loadJSON('cwb-settings') || {});
function saveSettings() { try { localStorage.setItem('cwb-settings', JSON.stringify(settings)); } catch {} }

/* ================= 狀態 ================= */
let boards = [], activeId = 'b1', board = null, assets = {};
const hist = new Map();
let selection = new Set();
let tool = 'text', action = null, editing = null;
let spaceDown = false, lastPointer = null, overCanvas = false, loaded = false;
const touches = new Map();
let uiOpen = false, wheelOp = null;
let clip = null;
let dialogEl = null, menuEl = null, menuAnchor = null;
let lastSavedAt = 0;

const B = () => boards.find(b => b.id === activeId);
const H = id => { if (!hist.has(id)) hist.set(id, { undo: [], redo: [] }); return hist.get(id); };
const snap = () => JSON.stringify(board.elements);
const emptyBoard = i => ({ id: 'b' + (i + 1), name: DEFAULT_NAMES[i] || ('頁面 ' + (i + 1)), elements: [], view: { x: 0, y: 0, zoom: 1 } });
const resolveColor = c => c === 'ink' ? (settings.theme === 'dark' ? '#f1f1f1' : '#1e1e1e') : c;

/* ================= 座標 ================= */
function toWorld(sx, sy) { const v = board.view; return { x: (sx - v.x) / v.zoom, y: (sy - v.y) / v.zoom }; }
function toScreen(wx, wy) { const v = board.view; return { x: wx * v.zoom + v.x, y: wy * v.zoom + v.y }; }

/* ================= 幾何 ================= */
const layoutCache = new WeakMap();
function textLayout(el) {
  let c = layoutCache.get(el);
  if (c && c.text === el.text && c.size === el.size && c.font === el.font) return c;
  mctx.font = `${el.size}px ${FONTS[el.font] || FONTS.sans}`;
  const lines = el.text.split('\n');
  let w = 0;
  for (const l of lines) w = Math.max(w, mctx.measureText(l).width);
  c = { text: el.text, size: el.size, font: el.font, lines, w: Math.max(w, el.size * 0.4), h: lines.length * el.size * LH };
  layoutCache.set(el, c);
  return c;
}
const penCache = new WeakMap();
function penBounds(pts) {
  const c = penCache.get(pts);
  if (c && c.n === pts.length) return c.b;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (let i = 0; i < pts.length; i += 2) {
    const x = pts[i], y = pts[i + 1];
    if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
  }
  const b = { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
  penCache.set(pts, { n: pts.length, b });
  return b;
}
function geom(el) {
  switch (el.type) {
    case 'rect': case 'ellipse': case 'image': return { x: el.x, y: el.y, w: el.w, h: el.h };
    case 'text': { const l = textLayout(el); return { x: el.x, y: el.y, w: l.w, h: l.h }; }
    case 'arrow': return { x: Math.min(el.x1, el.x2), y: Math.min(el.y1, el.y2), w: Math.abs(el.x2 - el.x1), h: Math.abs(el.y2 - el.y1) };
    case 'pen': return penBounds(el.points);
  }
  return { x: 0, y: 0, w: 0, h: 0 };
}
/* ---- 旋轉：矩形／圓形／文字／圖片／筆跡以 rot（弧度）繞自身中心旋轉；箭頭直接旋轉兩個端點 ---- */
function rotPt(x, y, cx, cy, c, s) { const dx = x - cx, dy = y - cy; return { x: cx + dx * c - dy * s, y: cy + dx * s + dy * c }; }
function normAng(a) { a = a % (2 * Math.PI); if (a > Math.PI) a -= 2 * Math.PI; if (a <= -Math.PI) a += 2 * Math.PI; return a; }
function setRot(el, r) { r = normAng(r); if (Math.abs(r) < 1e-4) delete el.rot; else el.rot = Math.round(r * 1e4) / 1e4; }
function rotateEl(el, o, px, py, d) {
  const c = Math.cos(d), s = Math.sin(d);
  if (o.type === 'arrow') {
    const p1 = rotPt(o.x1, o.y1, px, py, c, s), p2 = rotPt(o.x2, o.y2, px, py, c, s);
    el.x1 = r1(p1.x); el.y1 = r1(p1.y); el.x2 = r1(p2.x); el.y2 = r1(p2.y); return;
  }
  const g = geom(o), cx = g.x + g.w / 2, cy = g.y + g.h / 2, n = rotPt(cx, cy, px, py, c, s);
  moveEl(el, o, n.x - cx, n.y - cy);
  setRot(el, (o.rot || 0) + d);
}
function tlWorld(el) { const g = geom(el), r = el.rot || 0; return rotPt(g.x, g.y, g.x + g.w / 2, g.y + g.h / 2, Math.cos(r), Math.sin(r)); }
// 旋轉過的文字改內容或字級時，讓第一個字的位置保持不動
function keepTL(el, fn) {
  if (!el.rot || el.type !== 'text') { fn(); return; }
  const a = tlWorld(el); fn(); const b = tlWorld(el);
  el.x += a.x - b.x; el.y += a.y - b.y;
}
// 含旋轉的外框（世界座標、軸對齊）
function aabb(el) {
  const g = geom(el), r = el.rot;
  if (!r) return g;
  const c = Math.abs(Math.cos(r)), s = Math.abs(Math.sin(r)), w = g.w * c + g.h * s, h = g.w * s + g.h * c;
  return { x: g.x + g.w / 2 - w / 2, y: g.y + g.h / 2 - h / 2, w, h };
}
function rbounds(el) {
  const g = aabb(el);
  const p = (el.sw || 0) / 2 + (el.type === 'arrow' ? Math.max(12, (el.sw || 4) * 3.5) : 0) + 2;
  return { x: g.x - p, y: g.y - p, w: g.w + 2 * p, h: g.h + 2 * p };
}
function union(list, fn = aabb) {
  if (!list.length) return null;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const el of list) { const b = fn(el); x0 = Math.min(x0, b.x); y0 = Math.min(y0, b.y); x1 = Math.max(x1, b.x + b.w); y1 = Math.max(y1, b.y + b.h); }
  return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
}
function distSeg(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1, l2 = dx * dx + dy * dy;
  let t = l2 ? ((px - x1) * dx + (py - y1) * dy) / l2 : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
}
function hitEl(el, x, y, tol) {
  if (el.rot) {   // 把點轉回物件本身的座標再判斷
    const g = geom(el), q = rotPt(x, y, g.x + g.w / 2, g.y + g.h / 2, Math.cos(-el.rot), Math.sin(-el.rot));
    x = q.x; y = q.y;
  }
  const sw = (el.sw || 0) / 2;
  switch (el.type) {
    case 'text': case 'image': {
      const g = geom(el);
      return x >= g.x - tol && x <= g.x + g.w + tol && y >= g.y - tol && y <= g.y + g.h + tol;
    }
    case 'rect': {
      const g = geom(el), t = tol + sw;
      if (!(x >= g.x - t && x <= g.x + g.w + t && y >= g.y - t && y <= g.y + g.h + t)) return false;
      return !(x > g.x + t && x < g.x + g.w - t && y > g.y + t && y < g.y + g.h - t);
    }
    case 'ellipse': {
      const rx = el.w / 2, ry = el.h / 2, cx = el.x + rx, cy = el.y + ry;
      if (rx < 2 || ry < 2) return Math.hypot(x - cx, y - cy) <= tol + sw + Math.max(rx, ry);
      const nx = (x - cx) / rx, ny = (y - cy) / ry, d = Math.sqrt(nx * nx + ny * ny);
      return Math.abs(d - 1) * Math.min(rx, ry) <= tol + sw;
    }
    case 'arrow': return distSeg(x, y, el.x1, el.y1, el.x2, el.y2) <= tol + sw + 2;
    case 'pen': {
      const p = el.points, t = tol + sw, g = geom(el);
      if (x < g.x - t || x > g.x + g.w + t || y < g.y - t || y > g.y + g.h + t) return false;
      if (p.length <= 2) return Math.hypot(x - p[0], y - p[1]) <= t;
      for (let i = 0; i < p.length - 2; i += 2) if (distSeg(x, y, p[i], p[i + 1], p[i + 2], p[i + 3]) <= t) return true;
      return false;
    }
  }
  return false;
}
function hitTopOf(p, filter, ptype) {
  const tol = (ptype === 'touch' ? 12 : 6) / board.view.zoom;
  for (let i = board.elements.length - 1; i >= 0; i--) {
    const el = board.elements[i];
    if (filter && !filter(el)) continue;
    if (hitEl(el, p.x, p.y, tol)) return el;
  }
  return null;
}
function simplify(pts, eps) {
  const n = pts.length / 2;
  if (n < 3) return pts;
  const keep = new Uint8Array(n); keep[0] = keep[n - 1] = 1;
  const stack = [[0, n - 1]];
  while (stack.length) {
    const [a, b] = stack.pop();
    let md = 0, mi = -1;
    for (let i = a + 1; i < b; i++) {
      const d = distSeg(pts[2 * i], pts[2 * i + 1], pts[2 * a], pts[2 * a + 1], pts[2 * b], pts[2 * b + 1]);
      if (d > md) { md = d; mi = i; }
    }
    if (md > eps && mi > 0) { keep[mi] = 1; stack.push([a, mi], [mi, b]); }
  }
  const out = [];
  for (let i = 0; i < n; i++) if (keep[i]) out.push(pts[2 * i], pts[2 * i + 1]);

function onUp(e) {

  }
  const a = action;

  action = null;
  const z = board.view.zoom;
  switch (a.type) {
    case 'draw': a.el.points = simplify(a.el.points, 0.5 / z); commit(a.before); break;
    case 'shape': {
      const el = a.el, g = geom(el);

window.addEventListener('keydown', e => {
  if (e.key === 'Alt') e.preventDefault();   // 避免 Alt 觸發瀏覽器選單列
  if (e.isComposing || e.keyCode === 229 || !board) return;
  if (dialogEl) { if (e.key === 'Escape') { e.preventDefault(); closeDialog(); } return; }
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  if (t && t.tagName === 'BUTTON' && (e.key === ' ' || e.key === 'Enter')) return;
  if (e.key === 'Tab' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); setUIOpen(!uiOpen); return; }
  const mod = e.ctrlKey || e.metaKey;
  if (mod) {
    if (e.code === 'KeyZ') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
    else if (e.code === 'KeyY') { e.preventDefault(); redo(); }
    else if (e.code === 'KeyA') { e.preventDefault(); selectAll(); }
    else if (e.code === 'KeyS') { e.preventDefault(); exportJSON(); }
    return;
  }
  if (e.altKey) {
    const m = /^Digit([1-9])$/.exec(e.code);
    if (m && boards[m[1] - 1]) { e.preventDefault(); switchBoard(boards[m[1] - 1].id); }
    return;
  }
  if (e.key === 'Escape') { escapeKey(); return; }
  if (e.key === 'Delete' || e.key === 'Backspace') { if (selection.size) { e.preventDefault(); deleteSelection(); } return; }
  if (e.key === ' ') { e.preventDefault(); if (!spaceDown) { spaceDown = true; updateCursor(); } return; }
  if (e.key.startsWith('Arrow')) {
    if (selection.size) {
      e.preventDefault();
      const st = (e.shiftKey ? 10 : 1) / board.view.zoom;
      nudge(e.key === 'ArrowLeft' ? -st : e.key === 'ArrowRight' ? st : 0, e.key === 'ArrowUp' ? -st : e.key === 'ArrowDown' ? st : 0);
    }
    return;
  }
  if ((e.code === 'BracketLeft' || e.code === 'BracketRight') && selection.size) {   // [ ] 旋轉 15°，Shift 為 90°
    e.preventDefault(); rotateSelection((e.code === 'BracketRight' ? 1 : -1) * (e.shiftKey ? Math.PI / 2 : Math.PI / 12), true); return;
  }
  if (e.shiftKey && e.code === 'Digit1') { e.preventDefault(); fitView(); return; }
  if (e.shiftKey && e.code === 'Digit0') { e.preventDefault(); zoomAt(innerWidth / 2, innerHeight / 2, 1); return; }
  if (e.key === '+' || e.key === '=') { zoomBy(1.2); return; }
  if (e.key === '-' || e.key === '_') { zoomBy(1 / 1.2); return; }
  if (e.key === '?') { openHelp(); return; }
  if (e.shiftKey || e.repeat) return;
  const map = { KeyV: 'text', KeyH: 'hand', KeyP: 'pen', KeyT: 'text', KeyR: 'rect', KeyO: 'ellipse', KeyA: 'arrow', KeyE: 'eraser' };
  if (map[e.code]) { e.preventDefault(); setTool(map[e.code]); return; }
  if (e.code === 'KeyF') { e.preventDefault(); toggleFullscreen(); }
  if (e.code === 'KeyG') { e.preventDefault(); toggleGrid(); }
});

      const d = document.createElement('div'); d.className = 'banner';
      d.innerHTML = '<span>這個白板已在另一個分頁或視窗開啟。請只保留一個，避免內容互相覆蓋。</span><button type="button">我知道了</button>';
      d.querySelector('button').onclick = () => d.remove();
      document.body.appendChild(d);
    };
    bc.onmessage = ev => { if (ev.data === 'hello') { bc.postMessage('here'); warn(); } else if (ev.data === 'here') warn(); };
    bc.postMessage('hello');
  } catch {}
}

/* ================= 啟動 ================= */
async function init() {
  buildUI(); applyTheme(); resize();
  let state = null;
  try { db = await openDB(); state = await idbGet('state'); storageMode = 'idb'; }
  catch (err) { console.warn('IndexedDB 無法使用，改用 localStorage', err); storageMode = 'local'; state = loadJSON('cwb-state'); }
  const em = loadJSON('cwb-emergency');
  let usedEmergency = false;
  if (em && Array.isArray(em.boards) && (!state || (em.savedAt || 0) > (state.savedAt || 0))) { state = em; usedEmergency = true; }
  if (state && Array.isArray(state.boards) && state.boards.length) {
    assets = sanitizeAssets(state.assets);
    boards = state.boards.map((b, i) => sanitizeBoard(b, i));
    dedupeBoardIds(boards);
    activeId = boards.some(b => b.id === state.activeId) ? state.activeId : boards[0].id;
  } else {
    boards = DEFAULT_NAMES.map((n, i) => emptyBoard(i)); activeId = 'b1';
  }
  gcAssets();
  board = B();
  loaded = true;
  setUIOpen(!!settings.pinUI);
  rebuildTabs(); updatePanel(); updateUndo(); updateHint(); updateCursor();
  zoomLabel.textContent = Math.round(board.view.zoom * 100) + '%';
  setStatus('saved'); requestRender();
  if (usedEmergency) { changeSeq++; await saveNow(); }
  try { localStorage.removeItem('cwb-emergency'); } catch {}
  if (storageMode === 'local') toast('此瀏覽器無法使用 IndexedDB，已改用較小的備用儲存空間，請定期匯出備份。', 'err', 6000);
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch {}
  setupChannel();
  window.__cwb = { get boards() { return boards; }, get board() { return board; }, saveNow, setTool, get selection() { return selection; } };
}
init();
})();
</script>
