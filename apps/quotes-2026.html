<style>
  /* ============================================================
     ① 設定區：把下面引號裡換成你的 Google 試算表「發佈到網路」CSV 網址
     ============================================================ */
  /* 網址在下方 <script> 的 SHEET_CSV_URL */

  :root {
    --bg: #f4f0e8;
    --bg-2: #ece6da;
    --ink: #2f2c27;
    --ink-soft: #7a7265;
    --line: rgba(47, 44, 39, .14);
    --accent: #9a7b4f;
    --btn-bg: rgba(47, 44, 39, .05);
    --btn-bg-hover: rgba(47, 44, 39, .10);
  }
  body.dark {
    --bg: #17191d;
    --bg-2: #1e2126;
    --ink: #ddd7cc;
    --ink-soft: #8b867d;
    --line: rgba(221, 215, 204, .14);
    --accent: #c2a571;
    --btn-bg: rgba(221, 215, 204, .06);
    --btn-bg-hover: rgba(221, 215, 204, .12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 40%, var(--bg) 0%, var(--bg-2) 100%);
    background-attachment: fixed;
    color: var(--ink);
    font-family: "Noto Sans TC", system-ui, sans-serif;
    transition: background .8s ease, color .8s ease;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 28px 36px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    letter-spacing: .3em;
    color: var(--ink-soft);
  }
  .brand { font-family: "Noto Serif TC", serif; letter-spacing: .3em; }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 28px;
  }
  .card {
    max-width: 820px;
    width: 100%;
    text-align: center;
    transition: opacity .6s ease, transform .6s ease;
  }
  .card.hide { opacity: 0; transform: translateY(8px); }

  .mark {
    font-family: "Noto Serif TC", serif;
    font-size: 64px;
    line-height: 1;
    color: var(--accent);
    opacity: .45;
    height: 40px;
    margin-bottom: 28px;
  }
  .quote {
    font-family: "Noto Serif TC", serif;
    font-weight: 400;
    font-size: clamp(28px, 4.2vw, 50px);
    line-height: 1.85;
    letter-spacing: .06em;
    text-wrap: balance;
    word-break: break-word;
  }
  .quote.long  { font-size: clamp(22px, 3vw, 34px); }
  .quote.xlong { font-size: clamp(20px, 2.4vw, 28px); line-height: 2; }

  .divider {
    width: 36px; height: 1px;
    background: var(--accent);
    opacity: .6;
    margin: 40px auto 24px;
  }
  .author {
    font-size: 17px;
    letter-spacing: .25em;
    color: var(--ink);
  }
  .source {
    font-size: 14px;
    color: var(--ink-soft);
    margin-top: 8px;
    letter-spacing: .1em;
  }
  .date {
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 18px;
    letter-spacing: .2em;
    opacity: .8;
  }

  footer {
    padding: 0 36px 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    font-size: 13px;
    color: var(--ink-soft);
    letter-spacing: .15em;
  }
  .since { font-family: "Noto Serif TC", serif; letter-spacing: .25em; opacity: .8; }
  .notice { font-size: 12px; opacity: .7; }

  @media (max-width: 600px) {
    header { padding: 20px 20px 0; }
    footer { padding: 0 20px 20px; }
    .mark { font-size: 48px; margin-bottom: 18px; }
    .divider { margin: 30px auto 20px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card, body { transition: none; }
  }
</style>
</head>
<body>
  <header>
    <span class="brand">Allen Hu</span>
    <span id="notice" class="notice"></span>
  </header>

  <main>
    <div class="card hide" id="card">
      <p class="quote" id="quote" title="點一下換下一句">載入中…</p>
      <div class="divider"></div>
      <p class="author" id="author"></p>
      <p class="source" id="source"></p>
      <p class="date" id="date"></p>
    </div>
  </main>

  <footer>
    <span id="count"></span>
    <span class="since">Since 2026.11.23</span>
  </footer>

<script>
/* ============================================================
   ① 把引號裡換成你的 CSV 網址（教學第 3 步會拿到）
   留空的話會顯示下方的範例佳句
   ============================================================ */
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSsxZcxwpBtpbUfWAFXZ5I-WyiqG265i5ITHHoBeeIg_RCNzO0Gqtmg3dKO3aj02FR6EeUKk0E-UPQ7/pub?gid=0&single=true&output=csv";

/* ② 淺色模式的時段（24 小時制）：6 點到 18 點是淺色，其餘是深色 */
const LIGHT_FROM = 6;
const LIGHT_TO = 18;

/* 範例資料：沒有設定網址或讀取失敗時使用 */
const SAMPLE = [
  ["學而不思則罔，思而不學則殆。", "孔子", "2026-11-20", "《論語．為政》"],
  
];

/* ---------- 以下不需要修改 ---------- */
let quotes = [];
let bag = [];
let current = null;

const $ = id => document.getElementById(id);

// 簡單的 CSV 解析（支援引號、逗號、換行）
function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else if (c === '"') inQuotes = true;
    else if (c === ",") { row.push(field); field = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(field); rows.push(row); row = []; field = "";
    } else field += c;
  }
  if (field !== "" || row.length) { row.push(field); rows.push(row); }
  return rows;
}

function toItems(rows) {
  return rows
    .map(r => ({
      text: (r[0] || "").trim(),
      author: (r[1] || "").trim(),
      date: (r[2] || "").trim(),
      source: (r[3] || "").trim(),
    }))
    .filter(q => q.text);
}

function formatDate(s) {
  const m = s.match(/^(\d{4})[-\/.年](\d{1,2})[-\/.月](\d{1,2})/);
  if (!m) return s;
  return `${m[1]} 年 ${+m[2]} 月 ${+m[3]} 日`;
}

// 洗牌袋：整輪抽完才重來，而且不會連續抽到同一句
function refillBag() {
  bag = quotes.map((_, i) => i);
  for (let i = bag.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [bag[i], bag[j]] = [bag[j], bag[i]];
  }
  if (current !== null && bag.length > 1 && bag[bag.length - 1] === current) {
    [bag[0], bag[bag.length - 1]] = [bag[bag.length - 1], bag[0]];
  }
}

function render(q) {
  const el = $("quote");
  el.textContent = q.text;
  el.classList.toggle("long", q.text.length > 40 && q.text.length <= 80);
  el.classList.toggle("xlong", q.text.length > 80);
  $("author").textContent = q.author;
  $("source").textContent = q.source;
  $("date").textContent = q.date ? "收錄於 " + formatDate(q.date) : "";
}

let busy = false;
function next() {
  if (!quotes.length || busy) return;
  if (!bag.length) refillBag();
  current = bag.pop();
  const card = $("card");
  busy = true;
  card.classList.add("hide");
  setTimeout(() => {
    render(quotes[current]);
    card.classList.remove("hide");
    busy = false;
  }, card.dataset.ready ? 450 : 0);
  card.dataset.ready = "1";
}

function applyTheme() {
  const h = new Date().getHours();
  document.body.classList.toggle("dark", !(h >= LIGHT_FROM && h < LIGHT_TO));
}

async function load() {
  if (SHEET_CSV_URL) {
    try {
      const sep = SHEET_CSV_URL.includes("?") ? "&" : "?";
      const res = await fetch(SHEET_CSV_URL + sep + "t=" + Date.now());
      if (!res.ok) throw new Error(res.status);
      const rows = parseCSV(await res.text());
      quotes = toItems(rows.slice(1)); // 第一列是標題，跳過
      if (!quotes.length) throw new Error("empty");
    } catch (e) {
      console.warn("讀取試算表失敗，改用範例資料", e);
      quotes = toItems(SAMPLE);
      $("notice").textContent = "讀取試算表失敗，顯示範例";
    }
  } else {
    quotes = toItems(SAMPLE);
    $("notice").textContent = "範例資料";
  }
  $("count").textContent = `目前共收錄 ${quotes.length} 句`;
  next();
}

// 事件
document.body.addEventListener("click", e => {
  if (window.getSelection && String(window.getSelection())) return;
  next();
});
document.addEventListener("keydown", e => {
  if (e.key === " " || e.key === "ArrowRight" || e.key === "Enter") {
    e.preventDefault(); next();
  }
});

applyTheme();
setInterval(applyTheme, 60 * 1000);
load();
</script>
</body>
</html>
