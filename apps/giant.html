<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);

:root[data-theme="dark"]{--bg:#0c0f15;--card:#141923;--ink:#eceef3;--sub:#98a1b2;--line:#262d3a;--soft:#1b2230;--c:#8ea2ff;--on:#0c0f15}

body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.75 "Noto Sans TC",system-ui,sans-serif}

ul{margin:0;padding:0;list-style:none}
li{padding:8px 0;border-bottom:1px solid var(--line)}
.blind{margin-top:26px;padding:14px 18px;background:var(--soft);border-left:4px solid var(--sub)}

.ask{margin-top:32px;padding-top:24px;border-top:2px solid var(--ink)}
textarea{width:100%;min-height:104px;resize:vertical;padding:12px;border:1px solid var(--line);border-radius:2px;background:var(--bg);color:var(--ink);font:inherit}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}

.note{color:var(--sub);font-size:13px;margin-top:8px}
.sg{display:flex;flex-direction:column;gap:6px;align-items:flex-start;margin-bottom:12px}.sg span{color:var(--sub);font-size:13px}.chip{text-align:left;background:var(--soft);border:1px solid var(--line);color:var(--ink);padding:8px 12px;border-radius:2px;font:inherit;font-size:14px;line-height:1.55;cursor:pointer}.chip:hover{border-color:var(--c)}.chip:focus-visible{outline:3px solid var(--c);outline-offset:2px}

</style>
</head>

"維克多・弗蘭克":["我覺得工作與生活缺乏意義,如何找到方向?","處境無法改變時,我如何選擇面對的態度?","這段痛苦,可以轉化成什麼?"],
"麥可・波特":["我的事業在產業中的位置,用五力怎麼看?","我該選成本領導、差異化,還是聚焦?","我應該放棄哪些客戶或機會?"],
"克里斯汀生":["客戶是「雇用」我的產品來完成什麼工作?","有哪些新進者,可能從低端切入威脅我?","如何避免被現有客戶綁住,而錯過新市場?"],
"大前研一":["用 3C 分析我的事業:顧客、競爭者、公司各是什麼?","進入新市場前,關鍵成功因素是什麼?","放到全球視野,我的機會在哪裡?"],
"孫子":["我要進入一個競爭激烈的市場,如何先勝後戰?","我與對手的真實條件各是什麼,如何避實擊虛?","有沒有不正面衝突就達成目標的方法?"],
"貝佐斯":["這個決定是單向門還是雙向門?","以八十歲回顧,我會後悔做還是不做?","如何把客戶放在長期決策的核心?"],
"馮・諾伊曼":["這場談判或競爭,如何用博弈論分析對手的選擇?","如何把這個問題抽象成可推演的模型?","系統整體的行為,和各部分有什麼不同?"],
"夏農":["在大量雜訊下,如何找出真正有用的訊號?","我能先解一個簡化版的問題嗎?","這個決策,到底減少了多少不確定性?"],
"林納斯":["我想做開源專案,如何開始並吸引協作者?","我的設計如何簡化、減少特例?","如何先做出能跑的最小版本,再迭代?"],
"馬斯克":["如何用第一性原理拆解這個成本結構?","這個流程的哪些步驟,可以直接刪除?","如何設定遠大目標,並拆成可驗證的步驟?"],
"奧理略":["工作壓力很大時,如何分清可控與不可控?","被人誤解或批評,如何保持內在平靜?","如何設計晨間的自我預備習慣?"],
"愛比克泰德":["我對某件事很焦慮,哪些部分真的在我控制內?","如何修正我對這件事的看法?","在這個角色上,我應盡的責任是什麼?"]
};
const L=document.getElementById('list'),P=document.getElementById('panel'),T=document.getElementById('tabs');
let cur=M[0],flt='全部';
function esc(s){return s.replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x]))}
function build(m,q){return `請你扮演 ${m.n}(${m.e}),完全用他的思維框架與核心原則,幫我看下面這個問題。

【我的問題】
${q||'(請在此填入你的問題)'}

【請依序回答】
1. 先問我 1~3 個關鍵背景問題(若資訊不足)
2. 他會怎麼定義這個問題的本質
3. 他會依序問自己哪些問題
4. 他的建議方向與完整推理過程
5. 他的思維在這個問題上的盲點
6. 給我 3 個低風險、可立即嘗試的行動

【規則】
- 不捏造名言;不確定的以「根據其公開思想推演」標註
- 區分「他本人明確主張」與「你的推論」
- 只提供視角,最終決定由我做
- 涉及法律、醫療或重大財務,請提醒我諮詢專業人士
- 用繁體中文,條理清楚,不說空泛雞湯`}
function mark(){M.forEach(m=>m._b&&m._b.setAttribute('aria-pressed',m===cur))}
function list(){L.innerHTML='';M.filter(m=>flt==='全部'||m.cat===flt).forEach(m=>{const b=document.createElement('button');b.className='pick';
b.innerHTML=`<span class="mono">${m.n[0]}</span><span><b>${m.n}</b><small>${m.t}</small></span>`;
b.onclick=()=>{cur=m;mark();panel(true)};m._b=b;L.appendChild(b)});mark()}
['全部',...K].forEach(k=>{const b=document.createElement('button');b.className='tab';b.textContent=k;b.setAttribute('aria-pressed',k===flt);
b.onclick=()=>{flt=k;[...T.children].forEach(x=>x.setAttribute('aria-pressed',x===b));list()};T.appendChild(b)});
function panel(scroll){
const m=cur;
P.innerHTML=`<div class="cat">${m.cat}</div><h2>${m.n}</h2><div class="en">${m.e}</div>
<div class="quote">${m.q}</div>
<div class="cols"><div><h3>核心原則</h3><ul>${m.p.map(x=>`<li>${x}</li>`).join('')}</ul></div>
<div><h3>他會這樣問自己</h3><ul>${m.k.map(x=>`<li>${x}</li>`).join('')}</ul></div></div>
<div class="blind"><div><b>盲點:</b>${m.b}</div><div><b>${m.rl||"延伸閱讀"}:</b>${m.r}</div></div>
<div class="ask"><h3>把你的問題交給${m.n}</h3>
<div class="sg"><span>${m.n}式參考提問(點選帶入,可再修改)</span>${(SG[m.n]||[]).map((x,i)=>`<button class="chip" data-i="${i}">${x}</button>`).join('')}</div>
<textarea id="q" placeholder="寫下你的問題,或點上方參考提問"></textarea>
<div class="row"><button class="btn" id="gen">產生提問指令</button></div>
<div id="res"></div></div>`;
P.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{const q=document.getElementById('q');q.value=SG[m.n][c.dataset.i];q.focus()});
document.getElementById('gen').onclick=()=>{
const q=document.getElementById('q').value.trim();
const t=build(m,q);
document.getElementById('res').innerHTML=`<pre id="pre">${esc(t)}</pre><div class="row"><button class="btn" id="cp">複製指令</button><button class="btn alt" id="rs">清除</button></div><div class="note">複製後貼到 Claude 對話,即可得到${m.n}視角的完整分析。</div>`;
document.getElementById('cp').onclick=async e=>{try{await navigator.clipboard.writeText(t);e.target.textContent='已複製'}catch(_){const r=document.createRange();r.selectNodeContents(document.getElementById('pre'));const s=getSelection();s.removeAllRanges();s.addRange(r);e.target.textContent='已選取,請手動複製'}};
document.getElementById('rs').onclick=()=>{document.getElementById('res').innerHTML=''}};
if(scroll&&innerWidth<=860)P.scrollIntoView({behavior:'smooth'});
}
list();panel(false);
</script>
</body>
</html>
